plugins {
    id 'com.android.application'
}

def sdl3Dir = System.getenv("SDL3_ANDROID_DIR") ?: "/opt/SDL3"
def abis = (project.findProperty("abiFilters") ?: "arm64-v8a").split(",")

android {
    namespace 'com.al4xdev.dw2003'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.al4xdev.dw2003'
        minSdk 24
        targetSdk 34
        versionCode 102
        versionName System.getenv("DW3_VERSION") ?: '1.0.2'

        ndk {
            abiFilters.addAll(abis)
        }
        externalNativeBuild {
            cmake {
                arguments "-DSDL3_ANDROID_DIR=${sdl3Dir}", "-DANDROID_STL=c++_static",
                          "-DPSXSTACK_DXC=${project.findProperty('dxcPath') ?: "${rootDir}/../tools/dxc/bin/dxc"}"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            java.srcDirs += ["${sdl3Dir}/android-project/app/src/main/java"]
        }
    }

    externalNativeBuild {
        cmake {
            path '../CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
