plugins {
    id 'com.android.application'
}

def sdl3Dir = System.getenv("SDL3_ANDROID_DIR") ?: "/opt/SDL3"
def abis = (project.findProperty("abiFilters") ?: "arm64-v8a").split(",")

// versionName is the release tag without its "v" (build_android.sh exports it); versionCode follows it as
// MAJOR*10000 + MINOR*100 + PATCH, so every release installs over the previous one. A version that does not start
// with MAJOR.MINOR.PATCH ("dev-<hash>", or none) gets 1 and never replaces a release.
def dw3Version = System.getenv("DW3_VERSION") ?: "dev"
def dw3Semver = (dw3Version =~ /^v?(\d+)\.(\d+)\.(\d+)/)
def dw3VersionCode = dw3Semver.find() ? (dw3Semver.group(1).toInteger() * 10000 + dw3Semver.group(2).toInteger() * 100
                                          + dw3Semver.group(3).toInteger()) : 1

// The release key, from the environment (CI: the repository's secrets). Without it the APK is signed with the debug
// key of the machine that built it, which a phone refuses as an update of an APK signed with any other key.
def releaseKeystore = System.getenv("DW3_ANDROID_KEYSTORE")
def hasReleaseKey = releaseKeystore && file(releaseKeystore).isFile()
def dw3AppSuffix = System.getenv("DW3_ANDROID_APP_SUFFIX") ?: ""
def dw3AppLabel = System.getenv("DW3_ANDROID_APP_LABEL") ?: ""

android {
    namespace 'com.al4xdev.dw2003'
    compileSdk 34
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId "com.al4xdev.dw2003${dw3AppSuffix}"
        manifestPlaceholders = [appLabel: dw3AppLabel ?: "@string/app_name"]
        minSdk 24
        targetSdk 34
        versionCode dw3VersionCode
        versionName dw3Version

        ndk {
            abiFilters.addAll(abis)
        }
        externalNativeBuild {
            cmake {
                // ANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES: 16 KB-aligned libraries, which the devices running with 16 KB
                // pages (Android 15 and later) need to load them at all; NDK r27 still defaults to 4 KB.
                arguments "-DSDL3_ANDROID_DIR=${sdl3Dir}", "-DANDROID_STL=c++_static", "-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON",
                          "-DPSXSTACK_DXC=${project.findProperty('dxcPath') ?: "${rootDir}/../tools/dxc/bin/dxc"}"
            }
        }
    }

    signingConfigs {
        if (hasReleaseKey) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv("DW3_ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("DW3_ANDROID_KEY_ALIAS")
                keyPassword System.getenv("DW3_ANDROID_KEY_PASSWORD") ?: System.getenv("DW3_ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            java.srcDirs += ["${sdl3Dir}/android-project/app/src/main/java"]
        }
    }

    externalNativeBuild {
        cmake {
            path '../CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
