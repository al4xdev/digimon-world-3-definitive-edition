<svg xmlns="http://www.w3.org/2000/svg" width="900" height="640" viewBox="0 0 900 640" role="img" aria-labelledby="title desc">
<title id="title">Progression without the grind</title>
<desc id="desc">Training points earned, added up by level. The original gives 5 TP every level: 490 by level 99. The Definitive Edition gives 7 a level from 2 to 20, 9 from 21 to 40, 30 from 41 to 50 and none after: 613 by level 50. TP still caps at 99 in hand. Also: after three training sessions without a perfect result the fourth succeeds on every round; digivolution forms level 14 times faster; party members who stayed out of the fight earn the same experience; card booster drops give 15 packs.</desc>
<defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,&quot;Noto Sans&quot;,&quot;Liberation Sans&quot;,sans-serif}
.sx{transform-box:fill-box;transform-origin:center}
@keyframes k1{0.000%{opacity:0;transform:scale(.6)}30.000%{opacity:0;transform:scale(.6)}32.500%{opacity:1;transform:scale(1.1)}34.500%{opacity:1;transform:scale(1)}93.000%{opacity:1;transform:scale(1)}97.000%{opacity:0;transform:scale(1)}100.000%{opacity:0;transform:scale(1)}}
.k1{animation:k1 10s ease-in-out infinite}
@keyframes k2{0.000%{opacity:0}54.000%{opacity:0}58.000%{opacity:1}93.000%{opacity:1}97.000%{opacity:0}100.000%{opacity:0}}
.k2{animation:k2 10s ease-in-out infinite}
@keyframes k3{0.000%{transform:scale(1)}60.000%{transform:scale(1)}62.500%{transform:scale(1.14)}65.500%{transform:scale(1)}100.000%{transform:scale(1)}}
.k3{animation:k3 10s ease-in-out infinite}
@keyframes k4{0.000%{transform:scale(1)}63.500%{transform:scale(1)}66.000%{transform:scale(1.14)}69.000%{transform:scale(1)}100.000%{transform:scale(1)}}
.k4{animation:k4 10s ease-in-out infinite}
@keyframes k5{0.000%{transform:scale(1)}67.000%{transform:scale(1)}69.500%{transform:scale(1.14)}72.500%{transform:scale(1)}100.000%{transform:scale(1)}}
.k5{animation:k5 10s ease-in-out infinite}
@keyframes k6{0.000%{transform:scale(1)}70.500%{transform:scale(1)}73.000%{transform:scale(1.14)}76.000%{transform:scale(1)}100.000%{transform:scale(1)}}
.k6{animation:k6 10s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<symbol id="i-booster" viewBox="-16 -16 32 32"><rect x="-10" y="-14" width="20" height="28" rx="3" fill="currentColor"/><path d="M-10,-9 H10 M-10,9 H10" stroke="#000" stroke-opacity="0.3" stroke-width="2"/><text x="0" y="4.5" font-size="12" font-weight="800" text-anchor="middle" fill="#14161c" font-style="italic">R</text></symbol>
<symbol id="i-check" viewBox="-16 -16 32 32"><path d="M-10,0 L-3,8 L11,-8" fill="none" stroke="currentColor" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="i-person" viewBox="-16 -16 32 32"><circle cy="-7" r="6.5" fill="currentColor"/><path fill="currentColor" d="M-12,15 C-12,4 -7,0 0,0 C7,0 12,4 12,15 Z"/></symbol>
<linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9085e9" stop-opacity="0.28"/><stop offset="1" stop-color="#9085e9" stop-opacity="0"/></linearGradient>
</defs>
<rect width="900" height="640" rx="16" fill="#171a21"/>
<text x="30" y="46" font-size="26" fill="#f0efec" font-weight="800">Progression without the grind</text>
<text x="30" y="76" font-size="15.5" fill="#c3c2b7">Training points (TP) per level, added up. The late game lands where the original ended: level 40 to 50.</text>
