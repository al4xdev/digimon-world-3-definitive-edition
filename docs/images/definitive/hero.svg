<rect x="738" y="214" width="70" height="42" rx="21" fill="#1d2232" stroke="#3a4257" stroke-width="1.5"/>
<rect class="an glow2" x="737" y="213" width="72" height="44" rx="22" fill="#199e70" fill-opacity=".16" stroke="#3fcf98" stroke-width="2.2"/>
<use href="#i-thunder" x="747.5" y="223.5" width="23" height="23" color="#f2c230"/>
<use href="#i-machine" x="775.5" y="223.5" width="23" height="23" color="#a7adb8"/>
