<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-labelledby="title desc">
<title id="title">Learning an enemy's weaknesses</title>
<desc id="desc">Inspect shows only what you have found out. An example enemy starts with all five families unknown (???). A Fire technique: RESIST!, Fire is learnt as resisted. An Ice technique: WEAK!, and Water + Ice are learnt together because a pair shares one value. Resist Down lowers your best family, here Wind, by 80: 110 becomes 30, a new weakness. A Wind technique: WEAK!, Wind is learnt as weak. Libra reveals the rest at once: Thunder + Machine weak, Dark neutral.</desc>
<defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,&quot;Noto Sans&quot;,&quot;Liberation Sans&quot;,sans-serif}
.cx{transform-box:fill-box;transform-origin:center}
.an{animation-duration:14s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.45,0,.25,1)}
