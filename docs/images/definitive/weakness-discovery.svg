<text x="30" y="46" font-size="26" fill="#f0efec" font-weight="800">Learn the enemy as you fight</text>
<text x="30" y="74" font-size="15.5" fill="#c3c2b7">Inspect (L2, no turn spent) shows only what you have found out. Hitting a weakness or a</text>
<text x="30" y="96" font-size="15.5" fill="#c3c2b7">resistance with an elemental technique teaches its whole family. Everything else stays ???.</text>
