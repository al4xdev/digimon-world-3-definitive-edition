.rTM{animation-name:rTM}.urTM{animation-name:urTM}.frTM{animation-name:frTM}
@keyframes rDark{0%,70%{opacity:0}72%,93%{opacity:1}97%,100%{opacity:0}}
@keyframes urDark{0%,70%{opacity:1}72%,93%{opacity:0}97%,100%{opacity:1}}
