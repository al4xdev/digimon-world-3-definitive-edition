<text x="54" y="480" font-size="17.5" fill="#f0efec" font-weight="700">Affinity: your old elemental stats now power your attacks.</text>
<text x="54" y="506" font-size="14.5" fill="#c3c2b7">Added once for a weakness and once for a staggered target,</text>
<text x="54" y="526" font-size="14.5" fill="#c3c2b7">never on a plain neutral hit. Ceiling per family:</text>
