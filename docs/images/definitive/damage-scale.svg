<svg xmlns="http://www.w3.org/2000/svg" width="900" height="566" viewBox="0 0 900 566" role="img" aria-labelledby="title desc">
<title id="title">The damage multiplier</title>
<desc id="desc">The multiplier on your elemental techniques, lowest to highest: resisted 0.5; neutral 1.0; a blow with no element on a staggered target 1.2; a neutral element on a staggered target 1.2 to 1.8; a weakness 1.5 to 2.1; a weakness on a staggered target 1.7 to 2.9. Each bar stacks the 1.0 base, +0.5 for a weakness, +0.2 for a staggered target and the affinity, which comes from your Digimon's old elemental stats: up to 0.3 for Fire and Wind, up to 0.6 for Water + Ice, Thunder + Machine and Dark.</desc>
<defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,&quot;Noto Sans&quot;,&quot;Liberation Sans&quot;,sans-serif}
.cx{transform-box:fill-box;transform-origin:center}
.gr{animation-duration:2.4s;animation-iteration-count:1;animation-fill-mode:both;animation-timing-function:cubic-bezier(.2,.7,.2,1);transform-box:fill-box;transform-origin:50% 100%}
.br{animation:breath 9s cubic-bezier(.45,0,.25,1) infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes breath{0%,18%{transform:scaleY(1)}46%,58%{transform:scaleY(.04)}86%,100%{transform:scaleY(1)}}
.sh{animation:shine 9s linear infinite}
@keyframes shine{0%{transform:translateY(60px)}100%{transform:translateY(-180px)}}
@keyframes g0{0%,0%{transform:scaleY(0)}45%,100%{transform:scaleY(1)}}
@keyframes l0{0%,30%{opacity:0}52%,100%{opacity:1}}
.g0{animation-name:g0}.l0{animation-name:l0}
@keyframes g1{0%,7%{transform:scaleY(0)}52%,100%{transform:scaleY(1)}}
@keyframes l1{0%,37%{opacity:0}59%,100%{opacity:1}}
.g1{animation-name:g1}.l1{animation-name:l1}
@keyframes g2{0%,14%{transform:scaleY(0)}59%,100%{transform:scaleY(1)}}
@keyframes l2{0%,44%{opacity:0}66%,100%{opacity:1}}
.g2{animation-name:g2}.l2{animation-name:l2}
@keyframes g3{0%,21%{transform:scaleY(0)}66%,100%{transform:scaleY(1)}}
@keyframes l3{0%,51%{opacity:0}73%,100%{opacity:1}}
.g3{animation-name:g3}.l3{animation-name:l3}
@keyframes g4{0%,28%{transform:scaleY(0)}73%,100%{transform:scaleY(1)}}
@keyframes l4{0%,58%{opacity:0}80%,100%{opacity:1}}
.g4{animation-name:g4}.l4{animation-name:l4}
@keyframes g5{0%,35%{transform:scaleY(0)}80%,100%{transform:scaleY(1)}}
@keyframes l5{0%,65%{opacity:0}87%,100%{opacity:1}}
.g5{animation-name:g5}.l5{animation-name:l5}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style>
<symbol id="i-fire" viewBox="-16 -16 32 32"><path fill="currentColor" d="M0,-15 C5,-8 11,-3 10,5 C9.5,11 5,15 0,15 C-5,15 -10,11 -10,5 C-10,-1 -6,-4 -4,-9 C-2,-4 0,-2 2,-1 C4,-6 3,-10 0,-15 Z"/></symbol>
<symbol id="i-water" viewBox="-16 -16 32 32"><path fill="currentColor" d="M0,-15 C5,-7 10,-1 10,5 A10,10 0 0 1 -10,5 C-10,-1 -5,-7 0,-15 Z"/></symbol>
<symbol id="i-ice" viewBox="-16 -16 32 32"><g stroke="currentColor" stroke-width="2.6" stroke-linecap="round" fill="none"><path transform="rotate(0)" d="M0,0 V-14 M-4,-12 L0,-8 L4,-12"/><path transform="rotate(60)" d="M0,0 V-14 M-4,-12 L0,-8 L4,-12"/><path transform="rotate(120)" d="M0,0 V-14 M-4,-12 L0,-8 L4,-12"/><path transform="rotate(180)" d="M0,0 V-14 M-4,-12 L0,-8 L4,-12"/><path transform="rotate(240)" d="M0,0 V-14 M-4,-12 L0,-8 L4,-12"/><path transform="rotate(300)" d="M0,0 V-14 M-4,-12 L0,-8 L4,-12"/></g></symbol>
<symbol id="i-wind" viewBox="-16 -16 32 32"><g stroke="currentColor" stroke-width="2.8" stroke-linecap="round" fill="none"><path d="M-14,-5 H4 C9,-5 10,-12 5,-12 C2,-12 1,-9 2,-8"/><path d="M-14,2 H9 C14,2 14,9 9,9 C6,9 5,6 6,5"/><path d="M-11,9 H-1"/></g></symbol>
<symbol id="i-thunder" viewBox="-16 -16 32 32"><path fill="currentColor" d="M4,-15 L-9,2 H-1 L-4,15 L9,-3 H1 Z"/></symbol>
<symbol id="i-machine" viewBox="-16 -16 32 32"><circle r="11" fill="none" stroke="currentColor" stroke-width="5" stroke-dasharray="4.32 4.32"/><path fill="currentColor" fill-rule="evenodd" d="M9,0 A9,9 0 1 0 -9,0 A9,9 0 1 0 9,0 Z M3.5,0 A3.5,3.5 0 1 1 -3.5,0 A3.5,3.5 0 1 1 3.5,0 Z"/></symbol>
<symbol id="i-dark" viewBox="-16 -16 32 32"><path fill="currentColor" d="M0.00,-15.00 L3.64,-5.02 L14.27,-4.64 L5.90,1.92 L8.82,12.14 L0.00,6.20 L-8.82,12.14 L-5.90,1.92 L-14.27,-4.64 L-3.64,-5.02 Z"/></symbol>
<pattern id="hatch" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="7" fill="#9085e9" fill-opacity="0.28"/><rect width="3" height="7" fill="#9085e9"/></pattern>
<linearGradient id="shineg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".38"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
</defs>

