<svg xmlns="http://www.w3.org/2000/svg" width="900" height="506" viewBox="0 0 900 506" role="img" aria-labelledby="title desc">
<title id="title">The battle HUD</title>
<desc id="desc">The direct-button battle HUD, default layout with Xbox glyphs: Item on L1, Tech on R1, Fight on B, Run on X, Digivolve on Y, Tag on A, Inspect on L2 (it spends no turn), Blast on R2. Every action can be rebound from BATTLE HUD in the launcher.</desc>
<defs>
<style>text{font-family:-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,Roboto,&quot;Helvetica Neue&quot;,Arial,&quot;Noto Sans&quot;,&quot;Liberation Sans&quot;,sans-serif}
.cx{transform-box:fill-box;transform-origin:center}
.an{animation-duration:12s;animation-iteration-count:infinite;animation-timing-function:cubic-bezier(.45,0,.25,1)}
@keyframes h0{0%{opacity:0}1%,11%{opacity:1}12.5%,100%{opacity:0}}
@keyframes p0{0%,0.6%{transform:scale(1)}1.8%{transform:scale(.84)}3.4%,100%{transform:scale(1)}}
.h0{animation-name:h0}.p0{animation-name:p0}
@keyframes h1{0%,12.4%{opacity:0}13.5%,23.5%{opacity:1}25%,100%{opacity:0}}
@keyframes p1{0%,13.1%{transform:scale(1)}14.3%{transform:scale(.84)}15.9%,100%{transform:scale(1)}}
