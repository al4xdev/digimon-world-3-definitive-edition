.h3{animation-name:h3}.p3{animation-name:p3}
@keyframes h4{0%,49.9%{opacity:0}51%,61%{opacity:1}62.5%,100%{opacity:0}}
@keyframes p4{0%,50.6%{transform:scale(1)}51.8%{transform:scale(.84)}53.4%,100%{transform:scale(1)}}
.h4{animation-name:h4}.p4{animation-name:p4}
@keyframes h5{0%,62.4%{opacity:0}63.5%,73.5%{opacity:1}75%,100%{opacity:0}}
@keyframes p5{0%,63.1%{transform:scale(1)}64.3%{transform:scale(.84)}65.9%,100%{transform:scale(1)}}
.h5{animation-name:h5}.p5{animation-name:p5}
