<svg xmlns="http://www.w3.org/2000/svg" width="900" height="676" viewBox="0 0 900 676" role="img" aria-labelledby="title desc">
<title id="title">Cross-Play cloud sync</title>
<desc id="desc">Cross-Play cloud sync in the launcher (SAVES &amp; CLOUD): a handheld and a PC exchange the memory card card1.mcd through a free Cloudflare Worker, each upload a new revision. Pair a second device with a 6-digit code the host shows and approves; revoke a lost device. When both sides changed, choose to download the cloud save or upload the local one, after a local backup. 1 to 100 rotating local snapshots restore with one button.</desc>
