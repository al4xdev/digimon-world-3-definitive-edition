name: Bug report
description: Something is wrong in the PC port, the launcher, the build or the tools.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search the [open issues](https://github.com/al4xdev/digimon-world-3-definitive-edition/issues) first.
        **Never attach game files, a disc image or anything extracted from the disc.**

        **A report needs its code.** In the launcher: DEBUG, set LOGS to HEAVY, play until it happens, then DEBUG, SEND LOGS.
        The launcher shows a code like `K7M2Q-9XPB4`: type it below, or attach a photo or screenshot of it. The logs and
        your save (RPG data, nothing personal) go to the developer's server; with the code the developer opens them.
        A bug report without a code is closed by a bot until the code is added (edit the issue and it reopens).
        Only build, tools and other problems (the last four areas) may write `N/A`.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - The game (PC port), in play
        - The launcher
        - The AppImage (download, start, packaging)
        - Building the matching game / decompilation
        - Building the PC port or launcher from source
        - Tests or tools
        - Other
    validations:
      required: true
  - type: input
    id: report_code
    attributes:
      label: Report code
      description: The code SEND LOGS showed (DEBUG menu of the launcher), e.g. K7M2Q-9XPB4. Attach a photo of the screen in "anything else" if you cannot type it. `N/A` only for build and tools problems.
      placeholder: K7M2Q-9XPB4
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The AppImage's file name (e.g. dw2003-0.1.0-x86_64.AppImage) or the commit you built (`git rev-parse --short HEAD`).
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Distribution and version, desktop (Wayland/X11), GPU and driver, gamepad if relevant.
      placeholder: Fedora 44, KDE Wayland, NVIDIA 580, DualSense over USB
    validations:
      required: true
  - type: checkboxes
    id: disc
    attributes:
      label: Disc image
      options:
        - label: I use the EU disc (SLES-03936) as a raw .bin/.cue, and the launcher accepted it (SHA-1 verified).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, and what you expected instead. If the original game behaves differently (on a PS1 or an emulator), say how.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: From a new game or a save. The memory card already went with SEND LOGS.
      placeholder: |
        1. New game, pick ...
        2. Walk to ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Output
      description: The game's last lines (the launcher shows them after an error and has a Copy button), or the terminal output of a build.
      render: text
  - type: textarea
    id: extra
    attributes:
      label: Screenshots, video, anything else
